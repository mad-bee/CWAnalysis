[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CWAnalysis"
version = "1.0.3"
description = "Per-position Morse element timing analysis and PDF reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pypdf>=4.0", "pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
cw-analyse = "cw_analyser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
